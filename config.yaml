model:
  name: "mlx-community/Qwen2-VL-2B-Instruct-4bit"
  backend: "mlx"            # alternative future: "transformers-mps"
  max_new_tokens: 512
  temperature: 0.0

retriever:
  encoder: "openai/clip-vit-base-patch32"
  index_backend: "faiss"    # alternative: "chroma"
  index_dir: "index/"
  top_k: 1
  mode: "text2image"        # alternative: "text2text", "hybrid"

orchestrator:
  max_steps: 4
  max_images_in_context: 4  # conservative limit for a 2B model
  decision_max_new_tokens: 48

data:
  images_dir: "data/images"
  metadata: "data/metadata.jsonl"
